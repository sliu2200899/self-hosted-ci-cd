name: CI

# Pushing to a feature branch runs nothing. Opening or updating a PR runs tests
# and builds the image to prove it still builds — but does not publish it.
# Merging produces a push to master, which runs everything and publishes.
#
# `push` here is not "any commit anywhere" — the branches filter restricts it to
# master, and merging a PR is precisely how a push to master happens.
#
# CI's output is an image in GHCR — nothing more; the deployment half (Argo CD)
# is Phase 1b.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

env:
  IMAGE: ghcr.io/${{ github.repository }}/sample-app

# A newer push to the same branch makes an in-flight run obsolete. Cancelling it
# frees the runner pod immediately, which matters when maxRunners is 3.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # `arc-rdev` is the Helm release name of the runner scale set. With runner
    # scale sets the release name is the entire label — no `self-hosted` needed.
    runs-on: arc-rdev
    steps:
      - uses: actions/checkout@v4

      # The actions/runner image is minimal: it ships python3 but no `python`
      # and no pip at all. Unlike GitHub-hosted ubuntu-latest, nothing is
      # preinstalled — so the toolchain has to be set up explicitly.
      # Pinned to the same minor as the Dockerfile's base image so tests run
      # against the interpreter that ships in production.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: app
        run: pytest -v

  build:
    needs: test
    runs-on: arc-rdev
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    # Runs on BOTH events, but only publishes on push to master. On a PR this is
    # build validation: it proves the Dockerfile still builds before the merge,
    # without publishing an image from unreviewed code.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Skipped on PRs — nothing is published, so no credentials are needed.
      # This also keeps fork PRs working, where GITHUB_TOKEN is read-only and a
      # GHCR login would fail.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token — no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        run: |
          echo "sha_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build (and push on master)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          # The one line that separates validation from publication.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          # PR builds populate the cache that the post-merge build then reuses,
          # so publishing is fast and mostly re-tags already-built layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Pushed \`${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Pushed \`${{ env.IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build validated — not published (pull request)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The handoff to CD. Writes the freshly published tag into the Kustomize
  # overlay and commits it; Argo CD sees that commit and rolls the Deployment.
  # CI never talks to the cluster — a git commit is the entire interface.
  bump:
    needs: build
    runs-on: arc-rdev
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The runner image is minimal — no kustomize, no yq. Install into a temp
      # dir rather than a system path, since the runner is not root.
      - name: Install kustomize
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Pin the new image tag
        working-directory: deploy/overlays/dev
        run: |
          kustomize edit set image "${IMAGE}=${IMAGE}:${{ needs.build.outputs.sha_tag }}"
          git diff --stat

      - name: Commit and push
        run: |
          # Bot identity, so these commits are visibly machine-made in history.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A rebuild of an unchanged commit is a no-op, not a failure.
          if git diff --quiet; then
            echo "Image tag already current — nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add deploy/overlays/dev/kustomization.yaml
          git commit -m "Deploy ${{ needs.build.outputs.sha_tag }}

          Automated image tag bump from ${{ github.sha }}."

          # No infinite loop: commits pushed with GITHUB_TOKEN do not trigger
          # workflow runs, and the push paths filter excludes deploy/** anyway.
          git push

          echo "Bumped dev overlay to \`${{ needs.build.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Argo CD will sync within ~3 minutes." >> "$GITHUB_STEP_SUMMARY"
