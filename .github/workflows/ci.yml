name: CI

# A pull request runs tests only. A merge to master runs tests and then builds
# and pushes the image. CI's output is an image in GHCR — nothing more; the
# deployment half (Argo CD) is Phase 1b.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

env:
  IMAGE: ghcr.io/${{ github.repository }}/sample-app

# A newer push to the same branch makes an in-flight run obsolete. Cancelling it
# frees the runner pod immediately, which matters when maxRunners is 3.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # `arc-rdev` is the Helm release name of the runner scale set. With runner
    # scale sets the release name is the entire label — no `self-hosted` needed.
    runs-on: arc-rdev
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: app
        run: pytest -v

  build-push:
    needs: test
    runs-on: arc-rdev
    # Never on pull_request: a fork PR's GITHUB_TOKEN is read-only and could not
    # push anyway, and we do not want PR code producing published images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token — no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        run: |
          echo "sha_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          echo "Pushed \`${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed \`${{ env.IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
