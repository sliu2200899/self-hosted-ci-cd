apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-app

resources:
  - ../../base

# ─────────────────────────────────────────────────────────────────────────────
# THE CI → CD CONTRACT
#
# `newTag` below is the only thing CI writes back into git. On every merge to
# master the bump job runs:
#
#     kustomize edit set image <name>=<name>:sha-<short-sha>
#
# and commits the result. Argo CD notices the commit and rolls the Deployment.
# Nothing else connects the two halves — which is why Phase 2 can replace
# GitHub Actions with Buildkite without touching anything under deploy/.
#
# Always an immutable sha- tag, never `latest`: a mutable tag makes "what is
# actually running?" unanswerable and breaks rollback (which is just reverting
# the commit that changed this line).
# ─────────────────────────────────────────────────────────────────────────────
images:
  - name: ghcr.io/sliu2200899/self-hosted-ci-cd/sample-app
    newTag: sha-55f6609
